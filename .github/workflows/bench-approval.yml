name: bench approval

# Sets `bench/approval` on a PR's head: the commit status branch
# protection on main requires (packages/eval/README.md, "Benchmark
# workflow", says how to require it). A status belongs to a commit, so
# packages/eval/scripts/pipeline/approval.py decides from the commit and
# what it publishes, as the API reports them, never from the event: a head
# with numbers bench.yml found worse stays red until the repository
# owner's `bench-accept-worse` label is on one of its PRs; a numbers branch
# (bench/run-<run id> of this repository) bench.yml did not measure stays
# red; a PR that edits packages/eval/published-bench/ by hand stays red
# until the owner's `bench-accept-manual` label is on it. Every other PR
# is green.
#
# pull_request_target, not pull_request: a required status that is never
# set blocks the merge, so it must be set on every PR to main, a fork's
# included, and a pull_request run from a fork gets a read-only token. It
# is safe here because nothing of the PR is checked out or run: the job
# checks out approval.py alone from the base branch and reads the PR
# through the API by its number. No secret and no environment is used.
#
# bench.yml opens its PRs with its GitHub App's token, so `opened` runs this;
# a label a person adds or removes, a push or an edit runs it again.
# workflow_dispatch, on main only, decides again for one PR. The status is
# set to pending before deciding, and to failure if the job fails, so a
# failed run never leaves an earlier green.

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr:
        description: The number of the PR to decide on.
        type: number
        required: true

permissions: {}

jobs:
  approval:
    name: bench/approval
    if: ${{ github.event_name == 'pull_request_target' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read        # approval.py from the base branch; the head commit
      pull-requests: read   # the PR, its files, the PRs of its head
      issues: read          # the label events
      actions: read         # the bench.yml run a bench/compare points to
      statuses: write       # bench/approval on its head
    # One decision at a time per PR; each reads the PR's current state, so
    # the last one to run sets what is true now.
    concurrency:
      group: bench-approval-${{ inputs.pr || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # The base branch (pull_request_target's github.sha), or main for a
      # dispatch: never the PR's head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: packages/eval/scripts/pipeline/approval.py
          sparse-checkout-cone-mode: false
      - name: Decide and set bench/approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -I packages/eval/scripts/pipeline/approval.py \
            --repo "$GITHUB_REPOSITORY" --pr "$PR" --owner "$OWNER" --target-url "$RUN_URL"
      - name: A failed decision is a failure, never an earlier green
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state=failure \
            -f context=bench/approval -f description="The decision failed: re-run bench-approval." \
            -f target_url="$RUN_URL" > /dev/null
