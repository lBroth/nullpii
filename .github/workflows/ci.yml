name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: no job here writes to the repository.
permissions:
  contents: read

jobs:
  build:
    name: build & test (node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The tests mock ONNX Runtime: its CUDA download is not needed.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node == 24) }}
      # One leg measures coverage of everything that ships (core, CLI,
      # gateway) against the thresholds in vitest.config.ts.
      - run: npm run test:coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 24 }}
      - run: npm run build
      - run: npm run license-check
      - run: npm run circular-check
      - run: npm run sbom

  claude-code-mod:
    # The mod's hook tests, run by Claude Code's own test runner against a
    # fake sidecar (no model, tool or network).
    name: Claude Code mod tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global @anthropic-ai/claude-code@2.1.305
      # The marketplace people install the mod from, and the mod itself.
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict packages/claude-code-mod
      - run: claude plugin test packages/claude-code-mod

  eval-python:
    # The tracked Python tests of the eval kit (the traces-v3 generator and
    # the benchmark pipeline).
    name: eval kit (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q packages/eval/scripts/r3/traces_v3_gen/tests
      - run: python -m pytest -q packages/eval/scripts/pipeline/tests

  e2e-onnx:
    # Real-ONNX end-to-end suite: the core (test/e2e/) and the gateway on
    # the real engine (packages/gateway/test/e2e/). Loads the GLiNER model
    # and runs fixtures through the real inference path, so CI catches
    # regressions the mocked unit suite cannot (ScatterND clamping, decoder
    # index math, chunk-boundary dedupe, recognizer/ML reconciliation,
    # base64 layer, the policy prompt, the sidecar and the Messages proxy).
    #
    # The model is the one the library pins (DEFAULT_MODEL_REPO and
    # DEFAULT_MODEL_REVISION in src/defaults.ts, DEFAULT_MODEL in
    # src/model-manager.ts), fetched by `nullpii prefetch` exactly as a
    # user's install fetches it, hash checks included. The job fails
    # unless that revision is a commit SHA, so it never tests a moving
    # `main`.
    #
    # Gated on the repository variable `NULLPII_E2E_ENABLED`: it is set to
    # `true` (the pinned revision downloads anonymously from Hugging Face);
    # any other value turns the job off.
    name: e2e (real ONNX)
    if: ${{ vars.NULLPII_E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # A hung step fails the job within the hour, not at GitHub's 6 h limit.
    timeout-minutes: 60
    env:
      # The model cache, inside the workspace so actions/cache keeps it.
      XDG_CACHE_HOME: ${{ github.workspace }}/.nullpii-e2e-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The model the library pins
        id: model
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const { DEFAULT_MODEL, ModelManager } = await import("./dist/model-manager.js");
            const ref = `${DEFAULT_MODEL.repo}@${DEFAULT_MODEL.revision}`;
            if (!/^[0-9a-f]{40}$/.test(DEFAULT_MODEL.revision)) {
              console.error(`The library pins ${ref}, not a commit: pin DEFAULT_MODEL_REVISION first.`);
              process.exit(1);
            }
            const dir = new ModelManager().modelDir;
            appendFileSync(process.env.GITHUB_OUTPUT, `ref=${ref}\ndir=${dir}\n`);
          '
      - name: Restore the cached model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.model.outputs.dir }}
          key: nullpii-e2e-model-${{ steps.model.outputs.ref }}
      - name: Fetch the pinned model as a user's install does
        run: node bin/nullpii.mjs prefetch --backend cpu
      - name: Run real-ONNX E2E suite
        env:
          NULLPII_MODEL_DIR: ${{ steps.model.outputs.dir }}
        run: npm run test:e2e
      # The Claude Code mod end to end, under Claude Code's own test runner,
      # against this checkout's gateway with the same model: every request
      # the mod sends gets the real sidecar's answer to that very request,
      # but for its challenges: each must be the mod's first one, which the
      # sidecar answered, but for its nonce; the bridge signs it, and the
      # runner then checks the sidecar answers it the same (how, and why
      # through a bridge, is in packages/claude-code-mod/tests/e2e-bridge.ts
      # and e2e-run.mjs). The
      # gateway's binary imports `nullpii`, which is this checkout's core.
      - name: Link nullpii to this checkout for the gateway
        run: ln -s .. node_modules/nullpii
      - name: Build the gateway
        working-directory: packages/gateway
        run: npm run build
      - run: npm install --global @anthropic-ai/claude-code@2.1.305
      - name: Run the mod's E2E suite against a real gateway
        env:
          NULLPII_MODEL_DIR: ${{ steps.model.outputs.dir }}
        run: node packages/claude-code-mod/tests/e2e-sidecar.mjs
