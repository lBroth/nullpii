name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: no job here writes to the repository.
permissions:
  contents: read

jobs:
  build:
    name: build & test (node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node == 24) }}
      # One leg measures coverage of everything that ships (core, CLI,
      # gateway) against the thresholds in vitest.config.ts.
      - run: npm run test:coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 24 }}
      - run: npm run build
      - run: npm run license-check
      - run: npm run circular-check
      - run: npm run sbom

  claude-code-mod:
    # The mod's hook tests, run by Claude Code's own test runner against a
    # fake sidecar (no model, tool or network).
    name: Claude Code mod tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm install --global @anthropic-ai/claude-code@2.1.305
      - run: claude plugin test packages/claude-code-mod

  eval-python:
    # The tracked Python tests of the eval kit (the traces-v3 generator).
    name: eval kit (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q packages/eval/scripts/r3/traces_v3_gen/tests

  e2e-onnx:
    # Real-ONNX end-to-end suite (test/e2e/). Loads the GLiNER model and
    # runs a small fixture set through the real inference path, so CI
    # catches regressions the mocked unit suite cannot (ScatterND clamping,
    # decoder index math, chunk-boundary dedupe, recognizer/ML
    # reconciliation, base64 layer).
    #
    # The model is the one the library pins (DEFAULT_MODEL_REPO and
    # DEFAULT_MODEL_REVISION in src/defaults.ts, DEFAULT_MODEL in
    # src/model-manager.ts), fetched by `nullpii prefetch` exactly as a
    # user's install fetches it, hash checks included. The job fails
    # unless that revision is a commit SHA, so it never tests a moving
    # `main`.
    #
    # Opt-in via the repository variable `NULLPII_E2E_ENABLED=true`: set
    # it once the pinned revision downloads anonymously from Hugging Face.
    name: e2e (real ONNX)
    if: ${{ vars.NULLPII_E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      # The model cache, inside the workspace so actions/cache keeps it.
      XDG_CACHE_HOME: ${{ github.workspace }}/.nullpii-e2e-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The model the library pins
        id: model
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const { DEFAULT_MODEL, ModelManager } = await import("./dist/model-manager.js");
            const ref = `${DEFAULT_MODEL.repo}@${DEFAULT_MODEL.revision}`;
            if (!/^[0-9a-f]{40}$/.test(DEFAULT_MODEL.revision)) {
              console.error(`The library pins ${ref}, not a commit: pin DEFAULT_MODEL_REVISION first.`);
              process.exit(1);
            }
            const dir = new ModelManager().modelDir;
            appendFileSync(process.env.GITHUB_OUTPUT, `ref=${ref}\ndir=${dir}\n`);
          '
      - name: Restore the cached model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.model.outputs.dir }}
          key: nullpii-e2e-model-${{ steps.model.outputs.ref }}
      - name: Fetch the pinned model as a user's install does
        run: node bin/nullpii.mjs prefetch --backend cpu
      - name: Run real-ONNX E2E suite
        env:
          NULLPII_MODEL_DIR: ${{ steps.model.outputs.dir }}
        run: npm run test:e2e
