name: eval

# Nightly accuracy + benchmark run. Manual dispatch also supported.
# Pushes the refreshed `docs/guide/eval-results.md` if numbers changed.

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:

jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run build

      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - name: Install eval deps
        working-directory: packages/eval
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[presidio]"

      - name: Pre-fetch nullpii model
        run: node bin/nullpii.mjs prefetch --variant int8

      - name: nullpii accuracy (bundled)
        working-directory: packages/eval
        run: python -m nullpii_eval.run_accuracy --out accuracy-bundled.json

      - name: nullpii vs Presidio (bundled)
        working-directory: packages/eval
        run: |
          python -m spacy download en_core_web_lg
          python -m nullpii_eval.run_compare --out compare-bundled.json
        continue-on-error: true

      - name: Latency benchmark
        working-directory: packages/eval
        run: python -m nullpii_eval.run_benchmark --out benchmark.json

      - name: Render markdown
        working-directory: packages/eval
        run: |
          python -m nullpii_eval.render_tables \
            --accuracy accuracy-bundled.json \
            --compare compare-bundled.json \
            --benchmark benchmark.json \
            --out ../../docs/guide/eval-results.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            packages/eval/accuracy-bundled.json
            packages/eval/compare-bundled.json
            packages/eval/benchmark.json
            docs/guide/eval-results.md
