name: gateway-docker

# Multi-arch (amd64 + arm64) build of the `@lbroth/nullpii-gateway` Docker
# image, published to the GitHub Container Registry as
# ghcr.io/lbroth/nullpii-gateway. Kept off the main CI matrix and gated on
# changes that affect the image. Nothing is pushed unless the tests pass,
# and a release tag must point at a commit on main. The publishing job
# uses no build cache, so a poisoned cache entry cannot reach a published
# image.
#
# Triggers and the image tags they push:
#   - a release, called by release.yml once both npm packages are
#     published (so an image never ships for a version npm refused) →
#     `X.Y.Z`, `X.Y` and `latest`; a pre-release tag such as
#     `v0.6.0-rc.1` → only `0.6.0-rc.1`
#   - a push to `main` touching what goes into the image → `edge`
#   - every pushed build also gets `sha-<short commit>`
#   - a manual `workflow_dispatch` on `main` rebuilds and pushes `edge`;
#     on a tag or any other branch it builds without pushing
#
# The ONNX model is NOT baked in: the gateway downloads it into the
# image's cache volume the first time it needs it, unless it is
# prefetched or a pre-fetched directory is mounted (packages/gateway
# README).

on:
  push:
    branches: [main]
    paths:
      - 'packages/gateway/**'
      - 'src/**'
      - 'bin/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'biome.json'
      - 'LICENSE'
      - 'NOTICE'
      - '.dockerignore'
      - '.github/workflows/gateway-docker.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # GHCR names are lowercase; the owner's account is lBroth.
  IMAGE: ghcr.io/lbroth/nullpii-gateway

jobs:
  test:
    name: gate (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "image tags must point at a commit on main"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      # The tests mock ONNX Runtime: its CUDA download is not needed.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: build & push (linux/amd64,linux/arm64)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Push only from main or a release tag
        id: target
        run: |
          # A tag push reaches this workflow only through release.yml, once
          # npm has both packages (a called workflow sees the caller's
          # event, `push`); a manual run pushes from main only.
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/heads/main | workflow_dispatch:refs/heads/main) push=true ;;
            push:refs/tags/v*.*.*) push=true ;;
            *) push=false ;;
          esac
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF: push=$push"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: steps.target.outputs.push == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `latest` follows a stable release tag only: with latest=auto,
          # metadata-action adds it for `type=semver` and skips pre-releases.
          flavor: |
            latest=auto
          tags: |
            # release tag vX.Y.Z → X.Y.Z and X.Y (pre-releases: X.Y.Z-pre only)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # main → edge
            type=raw,value=edge,enable={{is_default_branch}}
            # every build → sha-<short commit>, for traceability
            type=sha,prefix=sha-,format=short

      - name: Build, and push from main or a release tag
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.target.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          no-cache: true
