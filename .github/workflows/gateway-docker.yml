name: gateway-docker

# Multi-arch (amd64 + arm64) build + publish of the `@nullpii/gateway`
# Docker image to the GitHub Container Registry. The image is large
# enough (~926 MB) that we keep the workflow off the main CI matrix —
# this is one job, gated on changes that actually affect the image.
#
# Triggers:
#   - push to `main` touching gateway / core code → `:edge` tag
#   - push of a tag matching `gateway-v*` → `:vX.Y.Z` + `:latest`
#   - manual `workflow_dispatch` for ad-hoc rebuilds
#
# The ONNX model is NOT baked in. The image pulls it from HuggingFace
# on first boot; air-gapped deploys mount a pre-fetched dir.

on:
  push:
    branches: [main]
    paths:
      - 'packages/gateway/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'biome.json'
      - '.dockerignore'
      - '.github/workflows/gateway-docker.yml'
    tags:
      - 'gateway-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/nullpii-gateway

jobs:
  build:
    name: build & push (linux/amd64,linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            # gateway-vX.Y.Z tag → vX.Y.Z + latest
            type=match,pattern=gateway-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/gateway-v') }}
            # main push → edge
            type=raw,value=edge,enable={{is_default_branch}}
            # always include the short sha for traceability
            type=sha,prefix=sha-,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
