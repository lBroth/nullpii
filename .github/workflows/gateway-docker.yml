name: gateway-docker

# Multi-arch (amd64 + arm64) build + publish of the `@lbroth/nullpii-gateway`
# Docker image to the GitHub Container Registry. The image is large
# enough (about 614 MB) that we keep the workflow off the main CI matrix,
# gated on changes that actually affect the image. Nothing is pushed
# unless the tests pass, and a `gateway-v*` tag must point at a commit on
# main. The publishing job uses no build cache, so a poisoned cache entry
# cannot reach a published image.
#
# Triggers:
#   - push to `main` touching gateway / core code → `:edge` tag
#   - push of a tag matching `gateway-v*` → `:vX.Y.Z` + `:latest`
#   - manual `workflow_dispatch` for ad-hoc rebuilds
#
# The ONNX model is NOT baked in. The image pulls it from HuggingFace
# on first boot; air-gapped deploys mount a pre-fetched dir.

on:
  push:
    branches: [main]
    paths:
      - 'packages/gateway/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'biome.json'
      - '.dockerignore'
      - '.github/workflows/gateway-docker.yml'
    tags:
      - 'gateway-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/nullpii-gateway

jobs:
  test:
    name: gate (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "image tags must point at a commit on main"; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: build & push (linux/amd64,linux/arm64)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            # gateway-vX.Y.Z tag → vX.Y.Z + latest
            type=match,pattern=gateway-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/gateway-v') }}
            # main push → edge
            type=raw,value=edge,enable={{is_default_branch}}
            # always include the short sha for traceability
            type=sha,prefix=sha-,format=short

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          no-cache: true
