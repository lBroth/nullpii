name: release

# Triggers when a tag matching v*.*.* is pushed, and only then: one
# trigger, so a release never publishes twice. Runs the full CI gate,
# then publishes to npm with provenance and creates the GitHub Release.
#
# Required repo configuration (one-time):
#   - Settings → Secrets and variables → Actions:
#       NPM_TOKEN  (npm automation token, "Publish" scope). Once npm trusted
#       publishing is configured for both packages, drop the token: the
#       publish jobs already have `id-token: write`.
#
# Permissions are granted per job, least privilege: only the publish jobs
# get an OIDC token, only the release job may write to the repository.
# The publish jobs do not use the npm cache.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: gate (lint + typecheck + test + build + license + circular + sbom)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run license-check
      - run: npm run circular-check
      - run: npm run sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: bom.json

  publish:
    name: npm publish --provenance
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/nullpii
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF#refs/tags/}
          TAG=${TAG#v}
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-gateway:
    # Publishes `@lbroth/nullpii-gateway` from packages/gateway/.
    # Depends on `publish` so the just-released `nullpii@x.y.z` is
    # already on the npm registry by the time we install it here for
    # the standalone gateway build.
    name: npm publish @lbroth/nullpii-gateway --provenance
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/@lbroth/nullpii-gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Install just-published nullpii into the gateway dir
        # The standalone gateway build needs `nullpii` resolvable. We
        # install the version that the `publish` job just pushed to npm
        # — `needs: verify` only, but the dependency on `publish` is
        # enforced by `needs: publish` at the job level (added below).
        run: |
          NULLPII_VERSION=$(node -p "require('./package.json').version")
          cd packages/gateway
          # Use --no-save so packages/gateway/package.json isn't mutated
          # before publish — the peer dep declaration stays intact.
          npm install --no-save --no-package-lock "nullpii@${NULLPII_VERSION}"
      - name: Build gateway dist
        run: |
          cd packages/gateway
          rm -rf dist
          npx tsc -p tsconfig.json
      - name: Skip if @lbroth/nullpii-gateway@<version> already published
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./packages/gateway/package.json').version")
          if npm view "@lbroth/nullpii-gateway@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            echo "Version $PKG_VERSION already on npm — skipping."
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: npm publish
        if: steps.check.outputs.already-published != 'true'
        working-directory: packages/gateway
        # `prepublishOnly` re-runs `rm -rf dist && tsc` — by this point
        # the just-installed `nullpii` is in `node_modules/`, so the
        # standalone build resolves correctly.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # `hf-push` job removed from the public release pipeline. The merge +
  # stage + push script lives under `packages/eval/private/` (gitignored)
  # and depends on raw LoRA adapters that are not part of the public
  # repository. Run it locally with `HF_TOKEN=… bash packages/eval/private/release/release.sh`
  # to update `lBroth/nullpii` on HuggingFace.

  github-release:
    name: create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Extract changelog body for tag
        id: changelog
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          awk "/^## \\[$VERSION\\]/{flag=1;next}/^## \\[/{flag=0}flag" CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then echo "Release $VERSION." > /tmp/notes.md; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
          path: .
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          body_path: /tmp/notes.md
          files: bom.json
          generate_release_notes: false
          draft: false
          prerelease: false
