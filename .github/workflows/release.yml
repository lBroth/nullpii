name: release

# Triggers when a tag matching v*.*.* is pushed, and only then: one
# trigger, so a release never publishes twice. Runs CI's checks (coverage
# thresholds and the mod's checks included; the eval kit's tests and the
# OS/Node matrix run in CI on the merge commit),
# checks that the tagged commit is on main and that the library, the
# gateway and the Claude Code mod all carry the tag's version, then
# publishes both npm packages with provenance and creates the GitHub
# Release, then builds and pushes the gateway image (gateway-docker.yml)
# and uploads the model card to Hugging Face (the model-card job).
# A pre-release tag (`v0.6.0-rc.1`) publishes to npm under the `next`
# dist-tag, as a GitHub pre-release, and moves no `latest` image tag.
#
# Publishing uses npm trusted publishing (OIDC): no npm token exists in
# the repository. One-time configuration:
#   - npmjs.com, for `nullpii` and for `@lbroth/nullpii-gateway`:
#       Settings → Trusted publishing → GitHub Actions, repository
#       lBroth/nullpii, workflow `release.yml`, environment `npm`.
#   - GitHub, Settings → Environments → `npm`: required reviewer (the
#     maintainer) and deployment tags `v*.*.*` only.
#   - GitHub, Settings → Rules: protect `main` and tags `v*` (no force
#     push or deletion; only maintainers create release tags).
#
# Permissions are granted per job, least privilege: only the publish jobs
# get an OIDC token, only the release job may write to the repository.
# The publish jobs use no cache and run no dependency install scripts.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: gate (versions + pins + model pin + lint + typecheck + coverage + build + license + circular + hygiene + sbom + mod)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "release tags must point at a commit on main"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # Checked before anything publishes, so a mismatch cannot leave a
      # release half published.
      - name: Every package version matches the tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          status=0
          for manifest in package.json packages/gateway/package.json \
            packages/claude-code-mod/.claude-plugin/plugin.json; do
            version=$(node -p "require('./$manifest').version")
            if [ "$version" != "$TAG_VERSION" ]; then
              echo "$manifest has version $version, the tag says $TAG_VERSION"
              status=1
            fi
          done
          # `npm version` writes the lockfile too; a stale one would install
          # under the old version.
          for field in version "packages[''].version"; do
            version=$(node -p "require('./package-lock.json').$field")
            if [ "$version" != "$TAG_VERSION" ]; then
              echo "package-lock.json $field is $version, the tag says $TAG_VERSION"
              status=1
            fi
          done
          # The mod starts the sidecar, which gets its token, from exactly
          # this release's packages (no range: what runs with the token is
          # what the mod was released with).
          pin="$TAG_VERSION"
          pins=$(grep -oE "GATEWAY_RELEASE = '[^']+'" packages/claude-code-mod/hooks/register.ts)
          if [ "$pins" != "GATEWAY_RELEASE = '$pin'" ]; then
            echo "the mod must start the sidecar from release $pin, found: $pins"
            status=1
          fi
          # A release moves the marketplace pin in the install commands.
          case "$TAG_VERSION" in
            *-*) ;;
            *)
              for doc in README.md packages/claude-code-mod/README.md docs/start.md; do
                stale=$(grep -oE 'lBroth/nullpii@v[0-9A-Za-z.-]+' "$doc" | sort -u | grep -vxF "lBroth/nullpii@v$TAG_VERSION" || true)
                if [ -n "$stale" ]; then
                  echo "$doc still pins $stale, the tag says lBroth/nullpii@v$TAG_VERSION"
                  status=1
                fi
              done
              # The mod README's gateway command installs this exact release.
              stale=$(grep -oE '(@lbroth/nullpii-gateway|nullpii)@[0-9][0-9A-Za-z.-]*' packages/claude-code-mod/README.md \
                | sort -u | grep -vxF -e "nullpii@$pin" -e "@lbroth/nullpii-gateway@$pin" || true)
              if [ -n "$stale" ]; then
                echo "packages/claude-code-mod/README.md installs $stale, the tag says $pin"
                status=1
              fi
              ;;
          esac
          # The gateway is built against this commit's core: its peer range
          # starts at this very version, pre-releases included.
          base=${TAG_VERSION%%-*}
          expected=">=$base-0 <$(node -p "const [a,b]=process.argv[1].split('.');a+'.'+(Number(b)+1)+'.0'" "$base")"
          peer=$(node -p "require('./packages/gateway/package.json').peerDependencies.nullpii")
          if [ "$peer" != "$expected" ]; then
            echo "packages/gateway/package.json peer on nullpii is $peer, expected $expected"
            status=1
          fi
          if ! grep -qF "## [$TAG_VERSION]" CHANGELOG.md; then
            echo "CHANGELOG.md has no ## [$TAG_VERSION] section"
            status=1
          fi
          exit "$status"
      # The default model must name a Hugging Face commit, not a branch, so
      # the repository cannot change what a release downloads,
      # and a SHA-256 for every file it fetches, which the pin test
      # (test/default-model-pin.test.ts, run by `npm run test:coverage` below) checks.
      - name: Default model is pinned to a commit and per-file hashes
        run: |
          grep -Eq "^export const DEFAULT_MODEL_REVISION = '[0-9a-f]{40}';" src/defaults.ts \
            || { echo "src/defaults.ts: DEFAULT_MODEL_REVISION is not a 40-hex commit"; exit 1; }
          grep -q "^export const DEFAULT_MODEL_SHA256" src/defaults.ts \
            || { echo "src/defaults.ts: no DEFAULT_MODEL_SHA256 map"; exit 1; }
          grep -q "^  sha256: DEFAULT_MODEL_SHA256,$" src/model-manager.ts \
            || { echo "src/model-manager.ts: DEFAULT_MODEL does not carry DEFAULT_MODEL_SHA256"; exit 1; }
          test -f test/default-model-pin.test.ts \
            || { echo "test/default-model-pin.test.ts is missing"; exit 1; }
      # The tests mock ONNX Runtime: its CUDA download is not needed.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run license-check
      - run: npm run circular-check
      - run: npm run hygiene
      - run: npm run sbom
      # The tag also releases the Claude Code mod (through the marketplace
      # pin): the same checks as ci.yml's mod job.
      - run: npm install --global @anthropic-ai/claude-code@2.1.305
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict packages/claude-code-mod
      - run: claude plugin test packages/claude-code-mod
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: bom.json

  publish:
    name: npm publish --provenance
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/nullpii
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: npm supports trusted publishing (>= 11.5.1)
        run: node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"
      - run: npm ci --ignore-scripts
      - run: npm run build
      # A re-run of the whole workflow after `nullpii` is out goes on to
      # the gateway instead of failing here.
      - name: Skip if nullpii@<version> already published
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "nullpii@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            echo "Version $PKG_VERSION already on npm — skipping."
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi
      # The verify job checked that this version is the tag's.
      - name: npm publish
        if: steps.check.outputs.already-published != 'true'
        run: npm publish --provenance --access public ${{ contains(github.ref_name, '-') && '--tag next' || '' }}

  publish-gateway:
    # Publishes `@lbroth/nullpii-gateway` from packages/gateway/, after
    # `nullpii` itself, which the gateway peer-depends on.
    name: npm publish @lbroth/nullpii-gateway --provenance
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/@lbroth/nullpii-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: npm supports trusted publishing (>= 11.5.1)
        run: node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"
      # The root build is what the gateway compiles against: its
      # `prepublishOnly` copies ../../dist into node_modules/nullpii and
      # runs tsc, so nothing is downloaded from the registry here.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Skip if @lbroth/nullpii-gateway@<version> already published
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./packages/gateway/package.json').version")
          if npm view "@lbroth/nullpii-gateway@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            echo "Version $PKG_VERSION already on npm — skipping."
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: npm publish
        if: steps.check.outputs.already-published != 'true'
        working-directory: packages/gateway
        run: npm publish --provenance --access public ${{ contains(github.ref_name, '-') && '--tag next' || '' }}

  # The model is not published from here: the maintainers upload it to
  # Hugging Face (lBroth/nullpii) themselves, from training artifacts that
  # are not in this repository. Its card is, once the release is out.

  model-card:
    # MODEL_CARD.md of the tagged commit becomes the README.md of the model
    # repository lBroth/nullpii, after both packages are published, so the
    # card on Hugging Face is the released version's. `model-card` refuses
    # unless the tag is the package's version and the highest release
    # tagged (an older release re-run never replaces a newer card), the
    # card's Files table is the files and SHA-256 src/defaults.ts pins (and
    # the model repository holds them at the pinned revision),
    # published-bench/ holds a run of the pipeline of this very version and
    # model, and the card's regions say what it holds; it reads the card
    # back at the commit its upload made. A pre-release does not replace
    # the card of the latest release.
    #
    # The token is HF_MODEL_CARD_TOKEN, a secret of the `huggingface`
    # environment: a fine-grained Hugging Face token with write access to
    # lBroth/nullpii only (not the frozen benchmark inputs' HF_TOKEN). The
    # owner creates it on huggingface.co (Settings → Access Tokens →
    # Fine-grained → Repositories permissions: lBroth/nullpii, write) and,
    # on GitHub, Settings → Environments → `huggingface`: deployment tags
    # `v*.*.*` only, then adds the secret there. Without it this job fails,
    # saying so.
    name: model card on Hugging Face
    needs: [publish, publish-gateway]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: huggingface
      url: https://huggingface.co/lBroth/nullpii
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the release tags, to check this is the highest
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes --only-binary ':all:' -r packages/eval/requirements-pipeline.txt
      - name: Upload MODEL_CARD.md as the model's card
        env:
          HF_MODEL_CARD_TOKEN: ${{ secrets.HF_MODEL_CARD_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        run: |
          if [ -z "$HF_MODEL_CARD_TOKEN" ]; then
            echo "::error::the HF_MODEL_CARD_TOKEN secret of the huggingface environment is not set: create a fine-grained Hugging Face token with write access to lBroth/nullpii only, add it to that environment, then re-run this job"
            exit 1
          fi
          python -I packages/eval/scripts/bench_pipeline.py model-card --tag "$GITHUB_REF_NAME" --upload

  github-release:
    name: create GitHub Release
    needs: [publish, publish-gateway]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract changelog body for tag
        id: changelog
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          awk "/^## \\[$VERSION\\]/{flag=1;next}/^## \\[/{flag=0}flag" CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then echo "Release $VERSION." > /tmp/notes.md; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: .
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          body_path: /tmp/notes.md
          files: bom.json
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  image:
    name: gateway image
    needs: [publish, publish-gateway]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/gateway-docker.yml
