name: security

# Supply-chain and leak gates for an open-source repo:
#   - secrets:  gitleaks on the commits a change adds and on the tree
#   - hygiene:  nothing private, generated, oversized or machine-specific
#   - codeql:   static analysis of the TypeScript and the Python eval kit
#   - deps:     dependency review (vulnerabilities, licences) on PRs
# Every third-party action and image is pinned by digest; Dependabot
# proposes the bumps (.github/dependabot.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the commits this change adds
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$PUSH_AFTER~1..$PUSH_AFTER"
          else
            RANGE="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo \
            --config /repo/.gitleaks.toml --log-opts="$RANGE" --redact --no-banner --exit-code 1
      - name: Scan the working tree
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" dir /repo \
            --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check every tracked file
        run: node scripts/check-repo-hygiene.mjs --all

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  deps:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Covers development tooling too, which may use these other
          # permissive licences. What ships (the core's production tree,
          # fastify and onnxruntime-node) is held to MIT, Apache-2.0, BSD,
          # ISC and CC0 by `npm run license-check`.
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, CC0-1.0, BlueOak-1.0.0, Unlicense, 0BSD
          # The eval kit's Python requirements (packages/eval: benchmark runs
          # and dataset generators, never shipped or bundled) pull in a few
          # packages whose detected licence this list does not cover: numpy,
          # torch and regex (combinations of permissive licences: Zlib,
          # BSL-1.0, Apache-2.0 WITH LLVM-exception, CNRI-Python), pyahocorasick
          # (BSD-3-Clause on PyPI; the scan also finds GPL text in its
          # sources; used only by the AB-1 dataset generator), and
          # pymorphy3-dicts-ru (CC-BY-SA-3.0 dictionary data, loaded only when
          # Presidio runs as a compared tool).
          allow-dependencies-licenses: pkg:pypi/numpy, pkg:pypi/torch, pkg:pypi/regex, pkg:pypi/pyahocorasick, pkg:pypi/pymorphy3-dicts-ru
