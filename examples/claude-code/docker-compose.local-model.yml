# SPDX-License-Identifier: Apache-2.0
#
# Same as `docker-compose.yml` but with the GLiNER model mounted from
# the host instead of downloaded from Hugging Face on first use. Use this
# variant when:
#
#   - the host has no outbound network reach (air-gapped deploy)
#   - you want to pin a specific local checkpoint while iterating
#   - you've already prefetched the model and want to skip the
#     ~1.2 GB cold-start download
#
# Prep:
#
#   # On a host with network access: prefetch into the cache. The command
#   # prints the directory it filled ("cached at: …"); copy it to the target.
#   npx -p nullpii -p onnxruntime-node nullpii prefetch
#
#   export MODEL_DIR_HOST=<that directory>
#   docker compose -f examples/claude-code/docker-compose.local-model.yml up -d
#
# The model dir must contain: model.onnx, tokenizer.json, gliner_config.json,
# tokenizer_config.json.

services:
  gateway:
    build:
      context: ../..
      dockerfile: packages/gateway/Dockerfile
    container_name: nullpii-gateway
    ports:
      # Loopback only: the gateway has no authentication of its own.
      - "127.0.0.1:8787:8787"
    environment:
      NULLPII_HOST: 0.0.0.0
      NULLPII_PORT: 8787
      NULLPII_UPSTREAM: https://api.anthropic.com
      NULLPII_BACKEND: cpu
      NULLPII_LOG_LEVEL: info
      # Points the engine at the mounted dir. Skips HF entirely.
      NULLPII_MODEL_DIR: /models
      # The sidecar API the Claude Code mod talks to: on when
      # NULLPII_SIDECAR_TOKEN is set in the shell that runs `docker compose`,
      # passed through as it is; off when that shell does not set it.
      NULLPII_SIDECAR_TOKEN:
    volumes:
      # Host model dir → container /models. Read-only so a buggy
      # container can't corrupt the cache. The path on the host is set
      # via `$MODEL_DIR_HOST` — fail loud if it isn't.
      - ${MODEL_DIR_HOST:?MODEL_DIR_HOST must point at a dir containing model.onnx + tokenizer.json}:/models:ro
      # The masking policy: the container reads
      # /home/node/.config/nullpii/config.json, not the file on the host.
      # To give the gateway the policy you use elsewhere (the mod reads it
      # from the sidecar), uncomment this; the directory must exist.
      # - ${HOME}/.config/nullpii:/home/node/.config/nullpii:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped
