#
# Local nullpii gateway in front of Claude Code (or any client that
# speaks the Anthropic Messages API). Point your client's baseURL at
# http://127.0.0.1:8787 and your requests get PII-sanitized before
# they leave your machine. From the root of a clone of the repository:
#
#   # once: download the model (~1.2 GB) into the cache volume
#   docker compose -f examples/claude-code/docker-compose.yml run --rm gateway \
#     node bin/nullpii.mjs prefetch --backend cpu
#   docker compose -f examples/claude-code/docker-compose.yml up -d
#
# Skip the prefetch and the first request that needs the model downloads
# it into the `nullpii-model-cache` volume, and waits for the download.
# The volume keeps it across restarts.

services:
  gateway:
    # Build the image from the repo. To run the published image instead,
    # replace the `build:` block with:
    #   image: ghcr.io/lbroth/nullpii-gateway:0.5
    build:
      context: ../..
      dockerfile: packages/gateway/Dockerfile
    container_name: nullpii-gateway
    ports:
      # Loopback only: the gateway has no authentication of its own.
      - "127.0.0.1:8787:8787"
    environment:
      NULLPII_HOST: 0.0.0.0
      NULLPII_PORT: 8787
      NULLPII_UPSTREAM: https://api.anthropic.com
      NULLPII_BACKEND: cpu
      NULLPII_LOG_LEVEL: info
      # The sidecar API the Claude Code mod talks to: on when
      # NULLPII_SIDECAR_TOKEN is set in the shell that runs `docker compose`,
      # passed through as it is; off when that shell does not set it.
      NULLPII_SIDECAR_TOKEN:
    volumes:
      # Persist the model download across container restarts. Mount a
      # host path instead (e.g. `./model-cache:/home/node/.cache/nullpii`)
      # if you want to inspect the cache.
      - nullpii-model-cache:/home/node/.cache/nullpii
      # The masking policy: the container reads
      # /home/node/.config/nullpii/config.json, not the file on the host.
      # To give the gateway the policy you use elsewhere (the mod reads it
      # from the sidecar), uncomment this; the directory must exist.
      # - ${HOME}/.config/nullpii:/home/node/.config/nullpii:ro
    healthcheck:
      # Liveness only: /health answers once the server listens, which takes
      # seconds; it does not wait for the model.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  nullpii-model-cache:
