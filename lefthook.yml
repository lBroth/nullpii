pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,js,json}'
      run: npm run lint
    typecheck:
      glob: '*.ts'
      run: npm run typecheck
    test:
      glob: '*.{ts,js}'
      run: npm test
    license-check:
      glob: 'package*.json'
      run: npm run license-check
    circular-check:
      glob: '*.ts'
      run: npm run circular-check
    # Leak gates (see SECURITY.md, "Supply chain and leak gates").
    hygiene:
      run: node scripts/check-repo-hygiene.mjs
    secrets:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks git --pre-commit --staged --config .gitleaks.toml --redact --no-banner
        else
          echo "gitleaks is not installed: secrets were NOT scanned locally (CI still blocks them). Install: brew install gitleaks" >&2
        fi
