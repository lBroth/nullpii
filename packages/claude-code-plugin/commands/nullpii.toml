description = "Control the nullpii daemon: status / restart / off"
prompt = """Inspect or control the nullpii sanitizing proxy daemon. Argument controls action:

- `status` (default if no argument): run `bash -c 'ps -ef | grep nullpii.*serve | grep -v grep; lsof -nP -iTCP:7330 -sTCP:LISTEN 2>/dev/null; ls -la ~/.cache/nullpii/plugin/'` and report whether the daemon is alive, what port it listens on, the state-file pid, and how long it has been running. Quote command output verbatim.

- `restart`: run `bash -c 'pkill -f \"nullpii.*serve\"; rm -f ~/.cache/nullpii/plugin/daemon-*.json; sleep 2; node \"${CLAUDE_PLUGIN_ROOT}/hooks/session-start.mjs\" <<< \"{}\"'` then verify with `lsof -nP -iTCP:7330 -sTCP:LISTEN` that port 7330 is listening again. Show the spawned pid.

- `off`: run `bash -c 'node \"${CLAUDE_PLUGIN_ROOT}/hooks/stop.mjs\" <<< \"{}\"; pkill -f \"nullpii.*serve\"; rm -f ~/.cache/nullpii/plugin/daemon-*.json'`. Confirm port 7330 is free with `lsof -nP -iTCP:7330 -sTCP:LISTEN || echo \"daemon down\"`. Warn the user that ANTHROPIC_BASE_URL is still set in their shell — until they `unset ANTHROPIC_BASE_URL` and relaunch Claude Code, every API call will hit ConnectionRefused.

Argument: {{args}}
"""
