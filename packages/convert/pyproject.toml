[project]
name = "nullpii-convert"
version = "0.0.2"
description = "Model conversion pipeline for nullpii — HF → ONNX/CoreML/GGUF + validation."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "nullpii contributors" }]

dependencies = [
  "huggingface-hub>=0.26.0",
  "tokenizers>=0.20.0",
  "onnx>=1.17.0",
  "onnxruntime>=1.20.0",
  "scikit-learn>=1.5.0",
  "numpy>=1.26.0",
  "click>=8.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.7.0"]

[project.scripts]
nullpii-convert = "nullpii_convert.pipeline:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nullpii_convert"]

[tool.hatch.build.targets.wheel.force-include]
"src/nullpii_convert/fixtures/consistency_prompts.json" = "nullpii_convert/fixtures/consistency_prompts.json"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RET", "PL"]
ignore = ["PLR0913"]

[tool.pytest.ini_options]
testpaths = ["tests"]
